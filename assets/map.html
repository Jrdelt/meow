<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>meow map</title>
<meta name="meow-page" content="{{PAGE}}">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/assets/map.css?token={{TOKEN}}">
</head>
<body>
<header>
  <span class="logo">meow</span>
  <span class="target"><span id="avatar" class="avatar"></span><span id="session"></span></span>
  <div id="status">
    <span id="counts"></span>
    <span id="mode" class="badge"></span>
    <span id="vpn" class="badge" hidden></span>
    <span id="conn" class="badge off">connecting</span>
  </div>
</header>
<main>
  <div id="top">
    <section class="card" id="recon" aria-label="Recon progress" hidden>
      <ul id="recon-list"></ul>
    </section>
    <section class="card" id="card-map">
      <div class="map-bar">
        <h2>Topology</h2>
        <button id="map-full" type="button" aria-pressed="false"
          title="Fill the window with the map (Esc goes back)">Expand</button>
      </div>
      <div id="stage">
        <div id="scroller"><div id="cy"></div></div>
        <div id="where"></div>
        <div id="legend"></div>
      </div>
    </section>
    <div class="side">
      <section class="card">
        <h2>This machine</h2>
        <div id="machine"></div>
      </section>
      <section class="card">
        <h2 id="detail-title">Report</h2>
        <div id="detail"></div>
      </section>
    </div>
  </div>
  <section class="card" id="card-host" hidden>
    <div class="host-head">
      <h2 id="host-title">Host</h2>
      <div id="host-tabs" role="tablist" aria-label="Host details"></div>
    </div>
    <div id="host-panels"></div>
  </section>
  <section class="card" id="card-cves">
    <h2 id="cves-title">CVEs</h2>
    <div id="cves"></div>
  </section>
  <div id="cards">
    <section class="card" id="card-hosts">
      <h2 id="hosts-title">Hosts</h2>
      <div id="hosts"></div>
    </section>
    <div id="machine-cards" class="group-of-cards"></div>
    <details class="card fold-card" id="card-notices" hidden>
      <summary><h2>Notices <span id="notices-count" class="count"></span></h2></summary>
      <ul id="notices"></ul>
    </details>
  </div>
  <section class="card" id="card-ai" hidden>
    <div class="ai-head">
      <h2 id="ai-title">AI</h2>
      <div id="ai-badges" class="ai-badges"></div>
    </div>
    <div id="ai-meta" class="dim ai-meta" hidden></div>
    <div id="ai-body" class="ai-prose"></div>
    <div id="ai-error" class="bad-text ai-error" hidden></div>
  </section>
</main>
<script src="/assets/cytoscape.min.js?token={{TOKEN}}"></script>
<script src="/assets/map.js?token={{TOKEN}}"></script>
</body>
</html>
