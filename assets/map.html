<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>meow map</title>
<meta name="meow-page" content="{{PAGE}}">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/assets/map.css?token={{TOKEN}}">
</head>
<body>
<header>
  <span class="logo">meow</span>
  <span class="target"><span id="avatar" class="avatar"></span><span id="session"></span></span>
</header>
<div id="status">
  <span id="counts"></span>
  <span class="spacer"></span>
  <span id="mode" class="badge"></span>
  <span id="vpn" class="badge"></span>
  <span id="conn" class="badge off">connecting</span>
</div>
<main>
  <div id="top">
    <section class="card" id="card-map">
      <h2>Topology</h2>
      <div id="stage">
        <div id="scroller"><div id="cy"></div></div>
        <div id="where"></div>
        <div id="legend"></div>
      </div>
    </section>
    <div class="side">
      <section class="card">
        <h2>This Machine</h2>
        <div id="machine"></div>
      </section>
      <section class="card">
        <h2 id="detail-title">Selected</h2>
        <div id="detail"></div>
      </section>
    </div>
  </div>
  <section class="card" id="card-advisory">
    <h2 id="advisory-title">Advisory</h2>
    <div id="advisory"></div>
  </section>
  <div id="cards">
    <div id="host-cards" class="group-of-cards"></div>
    <section class="card">
      <h2 id="hosts-title">Associated Hosts</h2>
      <div id="hosts"></div>
    </section>
    <div id="machine-cards" class="group-of-cards"></div>
    <section class="card">
      <h2>Background Tasks</h2>
      <ul id="tasks"></ul>
    </section>
    <section class="card">
      <h2>Notices</h2>
      <ul id="notices"></ul>
    </section>
  </div>
  <section class="card" id="card-ai" hidden>
    <div class="ai-head">
      <h2 id="ai-title">AI Triage</h2>
      <div id="ai-badges" class="ai-badges"></div>
    </div>
    <div id="ai-meta" class="dim ai-meta" hidden></div>
    <div id="ai-body" class="ai-prose"></div>
    <div id="ai-error" class="bad-text ai-error" hidden></div>
  </section>
</main>
<script src="/assets/cytoscape.min.js?token={{TOKEN}}"></script>
<script src="/assets/map.js?token={{TOKEN}}"></script>
</body>
</html>
