<svg xmlns="http://www.w3.org/2000/svg" width="120" height="90" viewBox="0 0 120 90">
<!-- meow map icon: a desktop computer: monitor and tower. Original artwork, same licence as the project. -->
<defs>
<filter id="a" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="b" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4.5" xChannelSelector="G" yChannelSelector="R"/></filter>
<pattern id="h" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><rect width="5" height="5" fill="#e3f2f9"/><line x1="0" y1="2.5" x2="5" y2="2.5" stroke="#58a6c8" stroke-width="1.6"/></pattern>
<g id="ink" stroke-linecap="round" stroke-linejoin="round">
<rect x="10" y="16" width="62" height="44" rx="3"/>
<path d="M36 60 L34 70 L50 70 L48 60"/>
<path d="M24 71 L60 71 L65 78 L19 78 Z"/>
<rect x="82" y="10" width="28" height="68" rx="2"/>
</g>
</defs>
<g filter="url(#a)">
<use href="#ink" fill="#ffffff" stroke="#2e2e2e" stroke-width="2.3"/>
<g fill="url(#h)" stroke="#2e2e2e" stroke-width="1.1" stroke-linejoin="round">
<rect x="15" y="21" width="52" height="34"/>
</g>
<g fill="none" stroke="#2e2e2e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
<path d="M87 19 H105 M87 26 H105 M87 33 H105"/>
<circle cx="96" cy="67" r="2.6"/>
</g>
</g>
<use href="#ink" fill="none" stroke="#2e2e2e" stroke-width="1" opacity="0.45" filter="url(#b)"/>
</svg>
