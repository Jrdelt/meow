<svg xmlns="http://www.w3.org/2000/svg" width="120" height="90" viewBox="0 0 120 90">
<!-- meow map icon: a hub: the network one interface is attached to. Original artwork, same licence as the project. -->
<defs>
<filter id="a" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="b" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="13" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4.5" xChannelSelector="G" yChannelSelector="R"/></filter>
<pattern id="h" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><rect width="5" height="5" fill="#e3f2f9"/><line x1="0" y1="2.5" x2="5" y2="2.5" stroke="#58a6c8" stroke-width="1.6"/></pattern>
<g id="ink" stroke-linecap="round" stroke-linejoin="round">
<path d="M10 44 L24 32 L110 32 L110 50 L96 62 L10 62 Z"/>
</g>
</defs>
<g filter="url(#a)">
<use href="#ink" fill="#ffffff" stroke="#2e2e2e" stroke-width="2.3"/>
<g fill="url(#h)" stroke="#2e2e2e" stroke-width="1.1" stroke-linejoin="round">
<rect x="16" y="49" width="7" height="8"/>
<rect x="26" y="49" width="7" height="8"/>
<rect x="36" y="49" width="7" height="8"/>
<rect x="46" y="49" width="7" height="8"/>
<rect x="56" y="49" width="7" height="8"/>
<rect x="66" y="49" width="7" height="8"/>
<rect x="76" y="49" width="7" height="8"/>
<rect x="86" y="49" width="7" height="8"/>
</g>
<g fill="none" stroke="#2e2e2e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
<path d="M10 44 L96 44 L110 32 M96 44 L96 62"/>
</g>
</g>
<use href="#ink" fill="none" stroke="#2e2e2e" stroke-width="1" opacity="0.45" filter="url(#b)"/>
</svg>
