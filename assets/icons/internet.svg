<svg xmlns="http://www.w3.org/2000/svg" width="180" height="120" viewBox="0 0 180 120">
<!-- meow map icon: a cloud: everything beyond the default route. Original artwork, same licence as the project. -->
<defs>
<filter id="a" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="9" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="b" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="1" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4.5" xChannelSelector="G" yChannelSelector="R"/></filter>
<pattern id="h" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><rect width="5" height="5" fill="#e6f3fa"/><line x1="0" y1="2.5" x2="5" y2="2.5" stroke="#b5d9e9" stroke-width="1.6"/></pattern>
<g id="ink" stroke-linecap="round" stroke-linejoin="round">
<path d="M44 96 C18 98 8 72 28 62 C16 40 44 22 62 36 C68 12 110 8 118 34 C140 20 172 40 156 62 C178 74 164 102 140 96 C128 112 98 110 90 98 C78 110 54 108 44 96 Z"/>
</g>
</defs>
<g filter="url(#a)">
<use href="#ink" fill="url(#h)" stroke="#2e2e2e" stroke-width="2.3"/>
<g fill="url(#h)" stroke="#2e2e2e" stroke-width="1.1" stroke-linejoin="round">

</g>
<g fill="none" stroke="#2e2e2e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

</g>
</g>
<use href="#ink" fill="none" stroke="#2e2e2e" stroke-width="1" opacity="0.45" filter="url(#b)"/>
</svg>
