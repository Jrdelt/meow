# Builds meow for macOS, Linux and Windows when a version tag (v1.2.3) is
# pushed, or when the workflow is run by hand (Actions -> release -> Run
# workflow) for the version in Cargo.toml: GitHub then makes the tag itself
# when it publishes. The files go on that version's GitHub Release: a .pkg
# installer for macOS, plus .tar.gz / .zip archives that `meow update`
# fetches, each with a .sha256 file. Nothing is published until the test
# job (fmt, clippy, unit tests) passes. A version with a pre-release part
# (1.2.3-rc.1) is published as a GitHub pre-release, never as the latest
# release that `meow update` installs.
#
# The build jobs compile third-party crates, whose build scripts can run any
# code, so they get a read-only token and no GH_TOKEN. Each platform has a
# build job of its own (not a matrix, whose jobs share one set of outputs).
# It hands its files to the publish job as a workflow artifact, and their
# SHA-256 as its job outputs. Any job of the run can replace an artifact,
# but only a job sets its own outputs, so the publish job takes a file only
# if it has the SHA-256 that its build job gave: one build cannot swap in
# another platform's files. Only the draft and publish jobs, which compile
# nothing, can write to the release, through the gh CLI the runners carry.
# Actions are pinned to a commit: checkout, upload-artifact and
# download-artifact. The build jobs are the same but for their name, runner
# and target; a test in src/release.rs checks that they are.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  draft:
    name: draft the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The version to release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Manual release workflow runs must target refs/heads/main (got $GITHUB_REF)." >&2
            exit 1
          fi
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Invalid SemVer version in Cargo.toml: '$version'" >&2
            exit 1
          fi
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME but Cargo.toml says $version." >&2
            exit 1
          fi
          if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            echo "$tag is released already: raise the version in Cargo.toml first." >&2
            exit 1
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
      - name: Draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # A version with a pre-release part (1.2.3-rc.1) is a GitHub
          # pre-release, never the latest release that `meow update` installs.
          case "$TAG" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          # A draft release made already (on github.com, or by an earlier run
          # that stopped half-way) is kept; the builds are added to it.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The draft release exists already; updating target and adding the builds to it."
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease="$prerelease"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --prerelease="$prerelease" --target "$GITHUB_SHA" \
              --title "meow $TAG" --notes-file .github/release-notes.md
          fi

  # The checks of checks.yml, for the commit that is released: the publish
  # job needs this one. Read-only, like the build jobs: it builds crates too.
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --lib --bins

  build-macos-arm64:
    name: build (macos-arm64)
    needs: draft
    runs-on: macos-latest
    timeout-minutes: 60
    # Read-only: this job runs crate build scripts, so it must not hold a
    # token that can change the repository or the release.
    permissions:
      contents: read
    env:
      BUILD_NAME: macos-arm64
      BUILD_TARGET: aarch64-apple-darwin
    outputs:
      archive-sha256: ${{ steps.package.outputs.archive-sha256 }}
      pkg-sha256: ${{ steps.package.outputs.pkg-sha256 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$BUILD_TARGET"
      - name: Build
        env:
          # Tells meow it is a release build, and which file is its own,
          # so `meow update` downloads releases instead of pulling code.
          MEOW_RELEASE_BUILD: ${{ env.BUILD_NAME }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo build --release --locked --target "$BUILD_TARGET"
      - name: Package
        id: package
        env:
          TAG: ${{ needs.draft.outputs.tag }}
          COPYFILE_DISABLE: "1"
        run: |
          version=${TAG#v}
          name="meow-$version-$BUILD_NAME"
          out="target/$BUILD_TARGET/release"
          mkdir -p stage dist
          cp LICENSE stage/LICENSE
          cp assets/cytoscape.LICENSE stage/THIRD-PARTY-CYTOSCAPE.LICENSE
          cp THIRD-PARTY-NOTICES.md stage/THIRD-PARTY-NOTICES.md
          case "$BUILD_NAME" in
          windows-*)
            cp "$out/meow.exe" stage/meow.exe
            ARCHIVE_NAME="dist/$name.zip" pwsh -NoProfile -Command 'Compress-Archive -Path stage/meow.exe, stage/LICENSE, stage/THIRD-PARTY-NOTICES.md, stage/THIRD-PARTY-CYTOSCAPE.LICENSE -DestinationPath $env:ARCHIVE_NAME'
            files="$name.zip"
            ;;
          *)
            cp "$out/meow" stage/meow
            chmod 0755 stage/meow
            tar -czf "dist/$name.tar.gz" -C stage meow LICENSE THIRD-PARTY-NOTICES.md THIRD-PARTY-CYTOSCAPE.LICENSE
            files="$name.tar.gz"
            ;;
          esac
          case "$BUILD_NAME" in
          macos-*)
            # Double-click installer: puts meow in /usr/local/bin.
            mkdir -p pkgroot/usr/local/bin
            cp "$out/meow" pkgroot/usr/local/bin/meow
            chmod -R u+rwX,go+rX,go-w pkgroot
            chmod 0755 pkgroot/usr/local/bin/meow
            pkgbuild --root pkgroot --ownership recommended \
              --identifier io.github.jrdelt.meow \
              --version "$version" --install-location / "dist/$name.pkg"
            files="$files $name.pkg"
            ;;
          esac
          # From inside dist/, so each .sha256 names the bare file, as
          # `meow update` and `sha256sum -c` next to a download expect.
          cd dist || exit 1
          for file in $files; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum -- "$file" >"$file.sha256"
            else
              shasum -a 256 -- "$file" >"$file.sha256"
            fi
            # Also a job output, which only this job can set.
            sum=$(cut -d ' ' -f 1 <"$file.sha256")
            case "$file" in
            *.pkg) echo "pkg-sha256=$sum" >>"$GITHUB_OUTPUT" ;;
            *) echo "archive-sha256=$sum" >>"$GITHUB_OUTPUT" ;;
            esac
          done
      - name: Hand the files to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meow-${{ env.BUILD_NAME }}
          path: dist/
          if-no-files-found: error
          # As long as a failed job of this run can be re-run: a re-run of
          # the publish job needs these files.
          retention-days: 30
          # A re-run of this job replaces what an earlier attempt kept,
          # instead of failing on the name.
          overwrite: true

