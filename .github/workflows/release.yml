# Builds meow for macOS, Linux and Windows when a version tag (v1.2.3) is
# pushed, or when the workflow is run by hand (Actions -> release -> Run
# workflow) for the version in Cargo.toml: GitHub then makes the tag itself
# when it publishes. The files go on that version's GitHub Release: a .pkg
# installer for macOS, plus .tar.gz / .zip archives that `meow update`
# fetches, each with a .sha256 file.
#
# The build jobs compile third-party crates, whose build scripts can run any
# code, so they get a read-only token and no GH_TOKEN: they hand their files
# to the publish job as workflow artifacts, one per build, which it checks
# build by build, so a build can hand over only its own files. Only the
# draft and publish jobs, which compile nothing, can write to the release,
# through the gh CLI the runners carry. Actions are pinned to a commit:
# checkout, upload-artifact and download-artifact.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  draft:
    name: draft the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The version to release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Manual release workflow runs must target refs/heads/main (got $GITHUB_REF)." >&2
            exit 1
          fi
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Invalid SemVer version in Cargo.toml: '$version'" >&2
            exit 1
          fi
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME but Cargo.toml says $version." >&2
            exit 1
          fi
          if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            echo "$tag is released already: raise the version in Cargo.toml first." >&2
            exit 1
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
      - name: Draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # A draft release made already (on github.com, or by an earlier run
          # that stopped half-way) is kept; the builds are added to it.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The draft release exists already; updating target and adding the builds to it."
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "meow $TAG" --notes-file .github/release-notes.md
          fi

  build:
    name: build (${{ matrix.name }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin }
          - { name: linux-x86_64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Read-only: this job runs crate build scripts, so it must not hold a
    # token that can change the repository or the release.
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        env:
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$MATRIX_TARGET"
      - name: Build
        env:
          # Tells meow it is a release build, and which file is its own,
          # so `meow update` downloads releases instead of pulling code.
          MEOW_RELEASE_BUILD: ${{ matrix.name }}
          MATRIX_TARGET: ${{ matrix.target }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo build --release --locked --target "$MATRIX_TARGET"
      - name: Package
        env:
          TAG: ${{ needs.draft.outputs.tag }}
          MATRIX_NAME: ${{ matrix.name }}
          MATRIX_TARGET: ${{ matrix.target }}
          COPYFILE_DISABLE: "1"
        run: |
          version=${TAG#v}
          name="meow-$version-$MATRIX_NAME"
          out="target/$MATRIX_TARGET/release"
          mkdir -p stage dist
          cp LICENSE stage/LICENSE
          cp assets/cytoscape.LICENSE stage/THIRD-PARTY-CYTOSCAPE.LICENSE
          case "$MATRIX_NAME" in
          windows-*)
            cp "$out/meow.exe" stage/meow.exe
            ARCHIVE_NAME="dist/$name.zip" pwsh -NoProfile -Command 'Compress-Archive -Path stage/meow.exe, stage/LICENSE, stage/THIRD-PARTY-CYTOSCAPE.LICENSE -DestinationPath $env:ARCHIVE_NAME'
            files="$name.zip"
            ;;
          *)
            cp "$out/meow" stage/meow
            chmod 0755 stage/meow
            tar -czf "dist/$name.tar.gz" -C stage meow LICENSE THIRD-PARTY-CYTOSCAPE.LICENSE
            files="$name.tar.gz"
            ;;
          esac
          case "$MATRIX_NAME" in
          macos-*)
            # Double-click installer: puts meow in /usr/local/bin.
            mkdir -p pkgroot/usr/local/bin
            cp "$out/meow" pkgroot/usr/local/bin/meow
            chmod -R u+rwX,go+rX,go-w pkgroot
            chmod 0755 pkgroot/usr/local/bin/meow
            pkgbuild --root pkgroot --ownership recommended \
              --identifier io.github.jrdelt.meow \
              --version "$version" --install-location / "dist/$name.pkg"
            files="$files $name.pkg"
            ;;
          esac
          # From inside dist/, so each .sha256 names the bare file, as
          # `meow update` and `sha256sum -c` next to a download expect.
          cd dist || exit 1
          for file in $files; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum -- "$file" >"$file.sha256"
            else
              shasum -a 256 -- "$file" >"$file.sha256"
            fi
          done
      - name: Hand the files to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meow-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
          # As long as a failed job of this run can be re-run: a re-run of
          # the publish job needs these files.
          retention-days: 30
          # A re-run of this job replaces what an earlier attempt kept,
          # instead of failing on the name.
          overwrite: true

  publish:
    name: publish the release
    needs: [draft, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch the builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: meow-*
          # Not merged: each build's files land in dist/meow-<build>/, so
          # the check below knows which build handed over which file. In
          # one merged folder a build could put its own copy of another
          # build's archive and .sha256 in place of the real ones.
          path: dist
      - name: Check the builds and add them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "Invalid release tag: $TAG" >&2; exit 1 ;;
          esac
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            echo "Refusing to clobber already-published release $TAG." >&2
            exit 1
          fi
          # The builds, as the build matrix names them. This list must
          # match the matrix; a test in src/release.rs checks that it does.
          builds="macos-arm64 macos-x86_64 linux-x86_64 linux-arm64 windows-x86_64"
          version=${TAG#v}
          # Expired artifacts are not an error to download-artifact: it
          # finds none and passes, or with one left unpacks it straight into
          # dist/. Say so here rather than fail on a missing folder below.
          if [ ! -d dist ] || [ -z "$(find dist -mindepth 1 -maxdepth 1 -type d -name 'meow-*' -print -quit)" ]; then
            echo "dist/ holds no meow-* build folders: the build artifacts may have expired: re-run all jobs." >&2
            exit 1
          fi
          cd dist || exit 1
          # diff marks every line, so a file name cannot pass for a
          # workflow command in the log.
          show_diff() {
            diff <(printf '%s\n' "$1") <(printf '%s\n' "$2") | cat -v >&2 || true
          }
          # One folder per build artifact and nothing else. With a single
          # artifact download-artifact unpacks it straight into dist/, so
          # that fails here too.
          expected=$(for build in $builds; do printf 'meow-%s\n' "$build"; done | LC_ALL=C sort)
          found=$(find . -mindepth 1 -maxdepth 1 -printf '%P\n' | LC_ALL=C sort)
          if [ "$found" != "$expected" ] || [ -n "$(find . -mindepth 1 -maxdepth 1 ! -type d -print -quit)" ]; then
            echo "The build artifacts are not the expected folders (< expected, > found):" >&2
            show_diff "$expected" "$found"
            exit 1
          fi
          uploads=""
          for build in $builds; do
            # The files the build job's Package step makes, named the same
            # way.
            dir="meow-$build"
            name="meow-$version-$build"
            case "$build" in
            windows-*) files="$name.zip" ;;
            *) files="$name.tar.gz" ;;
            esac
            case "$build" in
            macos-*) files="$files $name.pkg" ;;
            esac
            # Exactly this build's files and their .sha256 files, and
            # nothing else: a build cannot add, drop or rename a release
            # file, or hand over another build's. Only names from the
            # list above reach gh below.
            expected=$(for file in $files; do printf '%s\n%s.sha256\n' "$file" "$file"; done | LC_ALL=C sort)
            found=$(find "$dir" -mindepth 1 -printf '%P\n' | LC_ALL=C sort)
            if [ "$found" != "$expected" ] || [ -n "$(find "$dir" -mindepth 1 ! -type f -print -quit)" ]; then
              echo "$dir does not hold the expected files (< expected, > found):" >&2
              show_diff "$expected" "$found"
              exit 1
            fi
            for file in $files; do
              # One checksum line that names this file, so `sha256sum -c`
              # checks this file and no other.
              if ! awk -v want="$file" '{ sub(/\r$/, "") } NF == 2 && length($1) == 64 && $1 ~ /^[0-9a-f]+$/ && ($2 == want || $2 == "*" want) { ok++ } END { exit !(ok == 1 && NR == 1) }' "$dir/$file.sha256"; then
                echo "$dir/$file.sha256 is not one checksum line for $file." >&2
                exit 1
              fi
              # From inside the build's folder, as the .sha256 names the
              # bare file.
              (cd "$dir" && sha256sum --check --strict -- "$file.sha256") || exit 1
              # gh names each release file by its base name, so the
              # folder does not show in the release.
              uploads="$uploads $dir/$file $dir/$file.sha256"
            done
          done
          # shellcheck disable=SC2086 # the names hold no spaces or patterns
          gh release upload "$TAG" $uploads --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "Invalid release tag: $TAG" >&2; exit 1 ;;
          esac
          # Publishing makes the tag, at the commit that was built.
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --verify-tag --latest
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft=false --latest
          fi
