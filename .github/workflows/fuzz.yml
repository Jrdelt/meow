# Fuzzes the parsers that read untrusted text, and the C11 terminal filter,
# with cargo-fuzz (libFuzzer) and AddressSanitizer, also on the C code.
# Weekly, and by hand (Actions -> fuzz -> Run workflow) with a time of your
# choice. Each target starts from the seeds in fuzz/seeds/<target>. A crash
# fails the job and uploads the input that caused it. Read-only token.
name: fuzz

on:
  schedule:
    - cron: "41 3 * * 3" # weekly
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "300"

# Read-only: the jobs only check out the code and upload a crash input.
permissions:
  contents: read

# One fuzz run at a time; a new one waits rather than cancelling a run that
# may be about to find something.
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    if: github.event_name != 'schedule' || github.repository == 'Jrdelt/meow'
    strategy:
      fail-fast: false
      matrix:
        target: [parse_text, nmap_xml, terminal_lines, tap_filter]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz
        env:
          # The C filter is built by clang with AddressSanitizer and coverage
          # instrumentation, so the fuzzer sees inside it and catches memory
          # errors there too.
          CC: clang
          CFLAGS: -fsanitize=address,fuzzer-no-link
          SECONDS_PER_TARGET: ${{ github.event.inputs.seconds || '300' }}
          TARGET: ${{ matrix.target }}
        run: |
          case "$SECONDS_PER_TARGET" in ''|*[!0-9]*) echo "seconds must be a number"; exit 1;; esac
          mkdir -p "fuzz/corpus/$TARGET"
          cp "fuzz/seeds/$TARGET"/* "fuzz/corpus/$TARGET/"
          cargo +nightly fuzz run "$TARGET" "fuzz/corpus/$TARGET" -- \
            -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
