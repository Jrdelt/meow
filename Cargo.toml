[package]
name = "meow"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Local security triage shell, topology mapper & grounded audit workspace"
license = "MIT"
build = "build.rs"

[[bin]]
name = "meow"
path = "src/main.rs"

# Phase 1 dependencies only. Later phases add their crates when their code lands
# (petgraph).
[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6"
fd-lock = "4.0"
futures-util = "0.3"
getrandom = "0.3"
ipnetwork = "0.20"
portable-pty = "0.9"
# Terminal control is used through the `ratatui::crossterm` re-export.
ratatui = "0.30"
regex = "1"
reqwest = { version = "0.13", features = ["json", "query"] }
roxmltree = "0.20"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.29"
toml = "0.8"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
# Console-mode access for VT input/output; same crate crossterm uses.
crossterm_winapi = "0.9"
# Job Objects (kill a tool with everything it started) and the elevation check.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_UI_Shell"] }

[build-dependencies]
cc = "1.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# Unwind (not abort) so the terminal-restore Drop guard runs on panic.
panic = "unwind"
