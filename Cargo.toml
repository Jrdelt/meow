[package]
name = "meow"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
description = "Local security triage shell, topology mapper & grounded audit workspace"
repository = "https://github.com/Jrdelt/meow"
readme = "README.md"
license = "MIT"
build = "build.rs"

[[bin]]
name = "meow"
path = "src/main.rs"

# Crates are added in the step that first uses them.
[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6"
fd-lock = "4.0"
futures-util = "0.3"
getrandom = "0.4"
# The session's loopback server sets its own connection limits.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
ipnetwork = "0.20"
maxminddb = "0.33"
petgraph = "0.7"
portable-pty = "0.9"
# Terminal control is used through the `ratatui::crossterm` re-export.
ratatui = "0.30"
regex = "1"
reqwest = { version = "0.13", features = ["json", "query"] }
roxmltree = "0.20"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.29"
toml = "0.8"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
# Console-mode access for VT input/output; same crate crossterm uses.
crossterm_winapi = "0.9"
# Job Objects (kill a tool with everything it started) and the elevation check.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_UI_Shell"] }

[build-dependencies]
cc = "1.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# Unwind (not abort) so the terminal-restore Drop guard runs on panic.
panic = "unwind"
