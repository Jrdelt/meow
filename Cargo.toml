[package]
name = "meow"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Local security triage shell, topology mapper & grounded audit workspace"
license = "MIT"
build = "build.rs"

[[bin]]
name = "meow"
path = "src/main.rs"

# Phase 1 dependencies only. Later phases add their crates when their code lands
# (rusqlite, tokio, axum, petgraph, reqwest, ipnetwork, tempfile).
[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6"
fd-lock = "4.0"
portable-pty = "0.9"
# Terminal control is used through the `ratatui::crossterm` re-export.
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[build-dependencies]
cc = "1.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# Unwind (not abort) so the terminal-restore Drop guard runs on panic.
panic = "unwind"
